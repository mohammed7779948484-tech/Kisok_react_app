# Temporary review-focus configuration for PR #30.
#
# The PR is above the CodeRabbit Essentials 150-file review limit. These
# exclusions remove documentation, dev-only UI Lab surfaces, compatibility
# shims, generated/template files, barrel-only exports, tiny route adapters,
# and legacy components that are unused/deleted in the new runtime.
#
# Revisit or remove this file after PR #30 review so future changes to these
# paths are not silently excluded without intent.

reviews:
  path_filters:
    # Lockfile is generated dependency-resolution output.
    - "!**/pnpm-lock.yaml"

    # Agent/repository guidance and prose documentation.
    - "!.claude/agents/research/ui-researcher.md"
    - "!.claude/rules/supabase.md"
    - "!.claude/rules/ui.md"
    - "!.claude/skills/kisok-design-system/SKILL.md"
    - "!AGENTS.md"
    - "!CLAUDE.md"
    - "!docs/architecture.md"
    - "!docs/code-standards.md"
    - "!docs/data-and-supabase.md"
    - "!docs/design-system.md"

    # Dev-only UI Lab / executable documentation.
    - "!app/(dev)/ui-lab.tsx"
    - "!components/app/ui-lab.tsx"
    - "!design-system/lab/component-examples.tsx"
    - "!design-system/lab/index.ts"
    - "!design-system/lab/lab-section.tsx"
    - "!design-system/lab/state-examples.tsx"
    - "!design-system/lab/token-examples.tsx"
    - "!design-system/lab/ui-lab-screen.tsx"

    # Temporary legacy compatibility shims tracked for cleanup in issue #31.
    - "!components/feedback/empty-state.tsx"
    - "!components/feedback/error-state.tsx"
    - "!components/feedback/index.ts"
    - "!components/feedback/skeleton-list.tsx"
    - "!components/ui/button.tsx"
    - "!components/ui/index.ts"
    - "!components/ui/text.tsx"
    - "!core/responsive/index.ts"
    - "!core/theme.ts"
    - "!global.css"

    # Generated code / generator templates.
    - "!core/supabase/database.types.ts"
    - "!tools/generator/templates/component/component.tsx.ejs"
    - "!tools/generator/templates/screen/screen.tsx.ejs"

    # Barrel-only export surfaces; substantive implementations remain reviewed.
    - "!design-system/composites/index.ts"
    - "!design-system/feedback/index.ts"
    - "!design-system/foundations/index.ts"
    - "!design-system/index.ts"
    - "!design-system/layout/index.ts"
    - "!design-system/media/index.ts"
    - "!design-system/patterns/index.ts"
    - "!design-system/primitives/index.ts"
    - "!design-system/theme/index.ts"
    - "!design-system/tokens/index.ts"
    - "!features/catalog/index.ts"

    # Tiny Expo Router adapters; feature screens they delegate to remain reviewed.
    - "!app/(customer)/product-detail.tsx"
    - "!app/(customer)/products.tsx"
    - "!app/(customer)/search.tsx"
    - "!app/(preparation)/_layout.tsx"
    - "!app/+not-found.tsx"

    # Legacy/unused paths not part of the new runtime implementation.
    - "!features/catalog/screens/category-detail/components/category-brand-filter.tsx"
    - "!features/catalog/screens/product-detail/components/adaptive-variant-selector.tsx"
    - "!features/catalog/screens/product-detail/components/large-option-picker-sheet.tsx"
