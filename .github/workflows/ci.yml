name: CI

# Runs on every pull request. Requires NO secrets, so a PR from any contributor
# — human or agent — gets the same fast, honest signal.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes the previous run for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # PostgreSQL 16 ships on the GitHub runner image but is not on PATH.
  KISOK_PG_BIN: /usr/lib/postgresql/16/bin
  # Expo reads these at bundle time. They are placeholders so `expo export`
  # can run; no real project is contacted and nothing is deployed.
  EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  EXPO_PUBLIC_ENVIRONMENT: local

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The job never pushes, so do not leave a token in .git/config.
          persist-credentials: false

      # pnpm must be installed BEFORE setup-node, or `cache: pnpm` cannot find it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test:ci

      # Applies the migrations to a throwaway PostgreSQL and proves the checked-in
      # database types still match the real schema. Also proves the migrations
      # apply cleanly, which nothing else here does.
      - name: Verify database types against migrations
        # REQUIRED here: if the verifier cannot start PostgreSQL it FAILS rather
        # than reporting inconclusive, so a green CI always means the schema was
        # actually checked. Locally the same command still skips gracefully.
        env:
          KISOK_DB_VERIFY_REQUIRED: "1"
        run: pnpm db:verify

      # Proves the generator still emits code that compiles, lints, formats and
      # passes its own tests. Without this, template rot is invisible until an
      # agent hits it.
      - name: Generator smoke test
        run: pnpm generate:smoke

      - name: Summarise
        if: always()
        run: |
          {
            echo "### CI result"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Typecheck / lint / format / test / generator | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  web-export:
    name: Web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web bundle is how agents preview the UI, so a broken web build is a
      # broken developer workflow. `expo export` needs no login or EXPO_TOKEN.
      - name: Export web bundle
        run: pnpm export:web

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: dist
          retention-days: 7
          if-no-files-found: error

  doctor:
    name: Expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a real incompatibility; treats an unreachable Expo service as
      # inconclusive. See tools/doctor.mjs — an always-green check would have
      # swallowed a genuine SDK mismatch.
      - name: Run expo-doctor
        run: pnpm doctor
