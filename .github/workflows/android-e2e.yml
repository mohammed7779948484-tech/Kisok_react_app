name: Android E2E

# TIERED CI, like the Android build.
#
# This boots an emulator, installs a self-contained RELEASE build and drives the
# real UI with Maestro. It is minutes of runtime, so it runs only when asked:
# add the `e2e` label to a pull request, or dispatch it manually. Paying that
# cost on a docs change would train everyone to ignore the result.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro flows
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap, and it fails before an emulator is booted for nothing.
      - name: Check Maestro flows target the app this build produces
        run: pnpm check:e2e-appid

      # Authenticated journeys use only the committed disposable TEST backend.
      - name: Validate test environment and release configuration
        run: |
          pnpm exec expo config --json > "$RUNNER_TEMP/e2e-expo-config.json"
          node <<'NODE'
          const fs = require("node:fs");
          const env = fs.readFileSync(".env", "utf8");
          if (!/^EXPO_PUBLIC_ENVIRONMENT=["']?test["']?\s*$/m.test(env)) {
            throw new Error("Native E2E requires the documented TEST backend");
          }
          const config = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/e2e-expo-config.json", "utf8"),
          );
          if (!config.newArchEnabled || config.version !== require("./package.json").version ||
              !Number.isInteger(config.android.versionCode) || config.android.versionCode < 1) {
            throw new Error("Invalid release identity or New Architecture configuration");
          }
          console.log("Release configuration:", config.version, config.android.versionCode, "New Architecture enabled");
          NODE

      - name: Expo prebuild (Android)
        run: npx --yes expo prebuild --platform android --no-install --clean

      # RELEASE, not debug, and the reason matters: React Native's Gradle plugin
      # only embeds the JS bundle for variants outside `debuggableVariants`,
      # which defaults to ["debug"]. A debug APK therefore expects a Metro
      # server and shows the "Unable to load script" red screen without one —
      # Maestro would just time out waiting for a screen that never renders.
      # The release variant is self-contained, and Expo's template signs it with
      # the checked-in debug keystore, so this needs no secrets.
      #
      # ONE ABI, matching the emulator below. A multi-ABI APK crashed on launch
      # with SoLoaderDSONotFoundError: libreactnative.so — the system resolved
      # the app's native library directory to arm64 while the only libs SoLoader
      # could reach inside the APK were x86_64, so MainApplication.onCreate died
      # before React Native loaded and Maestro saw the launcher, not the app.
      # Building for exactly the emulator's ABI removes the ambiguity, and an
      # ABI that does not match now fails loudly at install
      # (INSTALL_FAILED_NO_MATCHING_ABIS) instead of as a mystery timeout.
      # It is also a much faster build.
      - name: Assemble release APK (self-contained, bundled JS, emulator ABI)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64

      # TEMPORARY: isolate the original Dialog while retaining the same E2E IDs.
      # Remove this comparison step after its before/after logs are captured.
      - name: Build original Dialog comparison APK
        env:
          BASE_DIALOG_COMMIT: 252796384270dd0375d3f3cb391c74067f65c06d
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          cp "$apk" "$RUNNER_TEMP/kisok-candidate.apk"
          trap 'git restore -- design-system/composites/dialog.tsx' EXIT
          git show "$BASE_DIALOG_COMMIT:design-system/composites/dialog.tsx" > design-system/composites/dialog.tsx
          git rev-parse "$BASE_DIALOG_COMMIT:design-system/composites/dialog.tsx"
          (cd android && ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64)
          cp "$apk" "$RUNNER_TEMP/kisok-original-dialog.apk"
          git restore -- design-system/composites/dialog.tsx
          git diff --exit-code -- design-system/composites/dialog.tsx
          cp "$RUNNER_TEMP/kisok-candidate.apk" "$apk"
          sha256sum "$RUNNER_TEMP/kisok-original-dialog.apk" "$apk"

      - name: Confirm the APK really contains a JS bundle
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if unzip -l "$apk" | grep -q "assets/index.android.bundle"; then
            echo "JS bundle present in $apk"
          else
            echo "::error::$apk has no assets/index.android.bundle — it would need Metro to start."
            unzip -l "$apk" | head -40
            exit 1
          fi
          # Which ABIs are actually in the APK. A mismatch with the emulator is
          # a launch-time crash, and this is the cheapest place to see it.
          echo "native libraries in the APK:"
          unzip -l "$apk" | grep -oE "lib/[^/]+/" | sort -u

      - name: Record native release identity and architecture
        run: |
          grep -q '^newArchEnabled=true' android/gradle.properties
          grep -R -E 'IS_NEW_ARCHITECTURE_ENABLED.*true' android/app/build/generated/source/buildConfig
          aapt_path=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt_path" dump badging android/app/build/outputs/apk/release/app-release.apk | head -1
          sha256sum android/app/build/outputs/apk/release/app-release.apk
          git rev-parse HEAD
          node -e 'for (const name of ["react-native", "react-native-reanimated", "react-native-screens"]) console.log(name, require(name + "/package.json").version)'

      # Pinned official archive; its digest is published on the GitHub release.
      - name: Install Maestro 2.11.0
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      # Record the tool version alongside the native evidence.
      - name: Report the Maestro version
        run: maestro --version

      # KVM must be enabled or the emulator falls back to software rendering and
      # times out. This is the documented setup for the emulator runner action.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A tablet profile, because that is the deployment target: a phone-sized
      # emulator would not exercise the landscape layouts at all.
      - name: Run Maestro flows on an emulator
        env:
          KISOK_BASELINE_APK: ${{ runner.temp }}/kisok-original-dialog.apk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 4096M
          disable-animations: false
          # ONE line, so it is ONE shell. This action runs the script line by
          # line, each in its own `sh -c`: an inline `set +e` does not survive
          # to the next line and `$?` reads the wrong shell, which is why an
          # earlier version's failure diagnostics silently never ran.
          script: bash .github/scripts/run-maestro.sh

      - name: Upload Maestro report
        if: always() && hashFiles('android-runtime-evidence/.redacted') != ''
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-evidence
          path: android-runtime-evidence
          retention-days: 7
          if-no-files-found: warn
