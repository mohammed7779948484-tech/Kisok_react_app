name: Android E2E

# TIERED CI, like the Android build.
#
# This boots an emulator, installs a debug build and drives the real UI with
# Maestro. It is minutes of runtime, so it runs only when asked: add the `e2e`
# label to a pull request, or dispatch it manually. Paying that cost on a docs
# change would train everyone to ignore the result.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro flows
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      EXPO_PUBLIC_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap, and it fails before an emulator is booted for nothing.
      - name: Check Maestro flows target the app this build produces
        run: pnpm check:e2e-appid

      - name: Expo prebuild (Android)
        run: npx --yes expo prebuild --platform android --no-install --clean

      # RELEASE, not debug, and the reason matters: React Native's Gradle plugin
      # only embeds the JS bundle for variants outside `debuggableVariants`,
      # which defaults to ["debug"]. A debug APK therefore expects a Metro
      # server and shows the "Unable to load script" red screen without one —
      # Maestro would just time out waiting for a screen that never renders.
      # The release variant is self-contained, and Expo's template signs it with
      # the checked-in debug keystore, so this needs no secrets.
      - name: Assemble release APK (self-contained, bundled JS)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Confirm the APK really contains a JS bundle
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if unzip -l "$apk" | grep -q "assets/index.android.bundle"; then
            echo "JS bundle present in $apk"
          else
            echo "::error::$apk has no assets/index.android.bundle — it would need Metro to start."
            unzip -l "$apk" | head -40
            exit 1
          fi

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # KVM must be enabled or the emulator falls back to software rendering and
      # times out. This is the documented setup for the emulator runner action.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A tablet profile, because that is the deployment target: a phone-sized
      # emulator would not exercise the landscape layouts at all.
      - name: Run Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 4096M
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # Clear the log so what follows is only this run, then capture
            # everything on failure: a Maestro timeout tells you a view was not
            # found, never why. Without this the only way to debug is to guess.
            adb logcat -c || true
            set +e
            maestro test .maestro/flows --format junit --output maestro-report.xml
            status=$?
            set -e
            if [ $status -ne 0 ]; then
              echo "::group::What was actually on screen"
              adb exec-out screencap -p > /tmp/failure.png || true
              adb shell dumpsys activity activities \
                | grep -E "mResumedActivity|mFocusedApp|topResumedActivity" || true
              echo "::endgroup::"
              echo "::group::App logcat (crashes, JS errors, Expo)"
              adb logcat -d -v brief \
                -s ReactNative:V ReactNativeJS:V AndroidRuntime:E ExpoModulesCore:V expo:V \
                | tail -300 || true
              echo "::endgroup::"
              echo "::group::Anything the app process logged"
              adb logcat -d -v brief | grep -iE "kisok|hermes|fatal|exception" | tail -200 || true
              echo "::endgroup::"
              cp /tmp/failure.png . 2>/dev/null || true
            fi
            exit $status

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            failure.png
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: warn
