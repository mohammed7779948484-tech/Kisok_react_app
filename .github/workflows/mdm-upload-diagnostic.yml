name: ManageEngine upload diagnostic

# MANUAL, ISOLATED PROBE — not the release pipeline. It builds nothing, signs
# nothing, and never creates or updates the ManageEngine enterprise app; its
# only job is to test ONE candidate upload representation at a time, using an
# already-verified production APK artifact, so each attempt costs seconds
# instead of the ~16 minutes a full Android build-and-release run takes.
#
# FOUR real-tenant attempts against `POST /emsapi/files` have all failed with
# HTTP 406 (a hand-built multipart body, native FormData with field `file`,
# native FormData with field `fileName`, and the same with a real
# X-Customer header added), so that endpoint's working wire shape is not yet
# known. This workflow isolates exactly ONE variable per run:
#
#   cloud_file                  — /emsapi/files, field `file`, no X-Customer.
#     OBSERVED to fail (406).
#   legacy_fileName              — /emsapi/files, field `fileName`, no
#     X-Customer. OBSERVED to fail (406).
#   cloud_file_with_customer     — /emsapi/files, field `file`, WITH
#     X-Customer. OBSERVED to fail (406) too — X-Customer does not fix it.
#   ems_fileName_with_customer   — /emsapi/files, field `fileName`, WITH
#     X-Customer. The one combination of the two variables above not yet
#     tested together. NOT YET OBSERVED.
#
# The remaining two variants target a DIFFERENT endpoint,
# `POST /api/v1/mdm/files` — documented as the predecessor `/emsapi/files`
# replaced. ManageEngine currently publishes TWO CONTRADICTORY request
# representations for that same endpoint, so each is its own named variant
# rather than one ambiguous "legacy" name that would hide which contract is
# under test:
#
#   legacy_api_v1_raw_example — a general API example: raw file bytes, no
#     multipart, Content-Type: application/json, Content-Disposition:
#     filename=<name>. NOT YET OBSERVED.
#   legacy_api_v1_cloud        — the Cloud-specific page for the SAME
#     endpoint: multipart/form-data (via native FormData, letting fetch
#     generate the boundary), Content-Disposition: filename=<name>,
#     Accept: application/json. This tenant IS ManageEngine Cloud, so this
#     is the highest-priority untested legacy candidate. NOT YET OBSERVED.
#
# See tools/mdm/probe-upload.ts and features/device-mode/docs/mdm-operations.md
# for the exact documented contracts and what is and is not established by
# them (in particular: the multipart field name `file` for
# legacy_api_v1_cloud is a conservative assumption, not proven by the
# Cloud-specific page).
#
# One run = one HTTP upload representation. Do not dispatch it to try
# several variants "just to see" in one go: a run that happens to succeed
# leaves a temporary file behind in the tenant's App Repository, and running
# more than one variant per dispatch would make it unclear which one the
# tenant actually accepted.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which upload representation to send the APK as"
        type: choice
        options:
          - ems_fileName_with_customer
          - legacy_api_v1_cloud
          - legacy_api_v1_raw_example
          - cloud_file_with_customer
          - legacy_fileName
          - cloud_file
        # The one /emsapi/files combination not yet tested: field `fileName`
        # together with a real X-Customer header. Highest-priority candidate
        # because it is still the SAME endpoint and SAME data centre this
        # tenant already targets, unlike the two legacy-endpoint variants.
        default: ems_fileName_with_customer
      run_id:
        description: >-
          Workflow run ID to download the kisok-release-apk artifact from. The
          DEFAULT run (35535503611) is the one this repository's docs
          document as independently verified (package, version, signing,
          production config). Overriding this input still runs the probe, but
          an overridden run carries NO such recorded verification — that is a
          property of the specific run, not of this workflow.
        type: string
        default: "35535503611"

# Least privilege: read the repository, and read this run's own Actions
# artifacts (required for actions/download-artifact to fetch a DIFFERENT
# run's artifact within this same repository). Nothing broader.
permissions:
  contents: read
  actions: read

# SERIALIZED: two probes racing each other against the same tenant would
# make it unclear which response belongs to which variant.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe the ManageEngine upload contract
    runs-on: ubuntu-latest
    # The ManageEngine credentials live in this environment (see
    # mdm-operations.md) — read-only here, exactly as the release workflow
    # uses them, and nothing else from it.
    environment: android-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # FAIL CLOSED immediately, before spending the artifact download or any
      # network call. Only NAMES are ever printed.
      - name: Check every required secret is present (fail closed)
        env:
          MDM_CLIENT_ID: ${{ secrets.MDM_CLIENT_ID }}
          MDM_CLIENT_SECRET: ${{ secrets.MDM_CLIENT_SECRET }}
          MDM_REFRESH_TOKEN: ${{ secrets.MDM_REFRESH_TOKEN }}
        run: |
          missing=0
          for name in MDM_CLIENT_ID MDM_CLIENT_SECRET MDM_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. This diagnostic refuses to run without all three."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # NOT rebuilt here — downloaded from a prior release run instead. Only
      # the DEFAULT run_id (35535503611) is the one this repository's docs
      # (features/device-mode/docs/worklog.md) record as independently
      # confirmed: package identity, version, production Supabase config and
      # signing certificate. That verification belongs to that specific run,
      # not to this workflow — an overridden run_id downloads whatever
      # kisok-release-apk artifact that run produced, unverified by this repo.
      - name: Download the production APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kisok-release-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: ${{ runner.temp }}/mdm-probe-apk

      # Locate the APK robustly rather than assuming a fixed path: v7 of
      # download-artifact extracts a single named artifact directly into
      # `path`, but this does not assume that shape blindly. Fails closed on
      # anything but EXACTLY one .apk — never silently picks the first of
      # several, which could probe the wrong build without anyone noticing.
      - name: Locate the downloaded APK
        id: locate
        run: |
          mapfile -t apks < <(find "${{ runner.temp }}/mdm-probe-apk" -iname '*.apk' -type f)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No .apk file found under ${{ runner.temp }}/mdm-probe-apk after downloading run ${{ inputs.run_id }}'s kisok-release-apk artifact."
            find "${{ runner.temp }}/mdm-probe-apk"
            exit 1
          fi
          if [ "${#apks[@]}" -gt 1 ]; then
            echo "::error::Found ${#apks[@]} .apk files under ${{ runner.temp }}/mdm-probe-apk after downloading run ${{ inputs.run_id }}'s kisok-release-apk artifact — refusing to guess which one to probe:"
            printf '  %s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          if [ ! -s "$apk" ]; then
            echo "::error::$apk is empty."
            exit 1
          fi
          size="$(stat -c%s "$apk" 2>/dev/null || stat -f%z "$apk")"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "located APK: $apk ($size bytes) from run ${{ inputs.run_id }}, artifact kisok-release-apk"

      # Cheap, best-effort confirmation only — never rebuilds Android. A
      # missing aapt2 on the runner image does not fail the probe.
      - name: Report package identity via aapt2, if available
        continue-on-error: true
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$aapt2" ]; then
            echo "aapt2 not found on this runner image — skipping (not required for the probe)"
            exit 0
          fi
          "$aapt2" dump badging "${{ steps.locate.outputs.apk_path }}" \
            | grep -E "^package:|versionCode|versionName" || true

      # MDM_CUSTOMER_ID is a GitHub Actions environment SECRET (never a
      # variable, never hard-coded here): it is only required by the probe
      # script itself, and only for the cloud_file_with_customer variant —
      # this step passes it unconditionally so the script can decide, rather
      # than duplicating that per-variant logic here.
      - name: Probe the ManageEngine upload contract
        env:
          MDM_CLIENT_ID: ${{ secrets.MDM_CLIENT_ID }}
          MDM_CLIENT_SECRET: ${{ secrets.MDM_CLIENT_SECRET }}
          MDM_REFRESH_TOKEN: ${{ secrets.MDM_REFRESH_TOKEN }}
          MDM_CUSTOMER_ID: ${{ secrets.MDM_CUSTOMER_ID }}
          MDM_DATA_CENTRE: ${{ vars.MDM_DATA_CENTRE || 'us' }}
        run: |
          node tools/mdm/probe-upload.ts \
            --apk "${{ steps.locate.outputs.apk_path }}" \
            --variant "${{ inputs.variant }}"
